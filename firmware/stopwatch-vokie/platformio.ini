[platformio]
default_envs = stopwatch

[env:stopwatch]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
upload_port = /dev/cu.usbmodem112201
monitor_port = /dev/cu.usbmodem112201
monitor_speed = 115200
board_upload.flash_size = 16MB
lib_deps =
  m5stack/M5Unified@^0.2.17
  h2zero/NimBLE-Arduino@^2.5.0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_M5STACK_STOPWATCH
  -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
